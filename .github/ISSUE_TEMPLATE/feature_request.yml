name: Feature request
description: An idea for the app, widgets or console
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What's awkward or missing today? Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you'd like it to work.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
      description: Workarounds, or other apps that do this well.
