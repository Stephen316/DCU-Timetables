# Builds the app and widget extension for the simulator and runs the unit tests, through
# the same script as a local run: scripts/ci.sh ios.
name: iOS

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "project.yml"
      - "Signing.xcconfig"
      - "scripts/ci.sh"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "project.yml"
      - "Signing.xcconfig"
      - "scripts/ci.sh"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The Xcode project.yml stamps, so bumping xcodeVersion there moves CI with it. A
      # version the runner image no longer carries fails here, not halfway through a build.
      - name: Select Xcode
        run: |
          version=$(sed -nE 's/^ *xcodeVersion: *"?([0-9.]+)"?.*/\1/p' project.yml)
          sudo xcode-select -s "/Applications/Xcode_${version}.app"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      - run: scripts/ci.sh ios
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-log
          path: build/ci/ios-test.log
