name: Desktop
on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml", "mobile/assets/data/Engineering*.json"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml", "mobile/assets/data/Engineering*.json"]

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run tauri build -- --bundles ${{ matrix.bundle }}
      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/DCU Timetable.app" DCU-Timetable-macos.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: dcu-timetable-macos
          path: desktop/DCU-Timetable-macos.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: dcu-timetable-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
