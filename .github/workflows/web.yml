# Production build of the console, which also type-checks every file, through the same
# script as a local run: scripts/ci.sh web. Needs no secrets: every page that reads
# Supabase is server-rendered on demand, so the build never calls it.
name: Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/ci.sh"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "scripts/ci.sh"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: scripts/ci.sh web
