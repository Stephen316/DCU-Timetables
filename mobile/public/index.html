<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Add to Home Screen: the icon, the name under it, and opening without Safari's bars. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Timetable" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- The app repaints these from its own theme once it loads; this covers the first frame. -->
    <meta name="theme-color" content="#212129" />
    <script>
      // The app is served from a sub-path on GitHub Pages and Expo's template has no base-path
      // placeholder, so the links above are relative. This page only ever loads at the app's
      // root, but the router then moves the URL (/app/class/…), and a relative link would
      // resolve against that when Safari reads it. Pin them to where the page loaded.
      for (const l of document.querySelectorAll('link[href^="./"]')) l.href = new URL(l.getAttribute('href'), location.href).href;
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #eee8d5;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #212129;
        }
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /*
        The root element fills the screen, pinned there. iOS 26 draws a Liquid Glass blur over
        the top of a Home Screen web app, and no meta tag or CSS turns it off; WebKit leaves it
        off only where a fixed box, full width, more than 10pt tall and with a solid background,
        covers the top edge. Our headers scroll with their screens, so the app itself is that
        box, painted the canvas colour its headers are, which costs no space at the top.
        The app keeps the colour in step with its theme.
      */
      #root {
        display: flex;
        position: fixed;
        inset: 0;
        background-color: #eee8d5;
      }
      @media (prefers-color-scheme: dark) {
        #root {
          background-color: #212129;
        }
      }
      /* The browser's focus ring on text fields; the caret already shows which one is active. */
      input:focus,
      textarea:focus {
        outline: none;
      }
      /*
        A field the browser autofills gets its own fill — a square, light blue or slate box
        inside the rounded card. Holding the change off keeps the card's colour behind it.
      */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus {
        transition: background-color 0s 600000s, color 0s 600000s;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
