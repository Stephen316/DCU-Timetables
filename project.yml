name: DCUTimetable

options:
  bundleIdPrefix: com.stephenh.dcutimetable
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Signing lives in Local.xcconfig (git-ignored) so your Team ID stays out of the repo and
# survives `xcodegen generate`. Create it once: cp Local.xcconfig.example Local.xcconfig
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  DCUTimetable:
    type: application
    platform: iOS
    sources:
      - path: ios/DCUTimetable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stephenh.dcutimetable
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: "DCU Timetable"
        ENABLE_TESTABILITY: YES

  DCUTimetableTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/DCUTimetableTests
    dependencies:
      - target: DCUTimetable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stephenh.dcutimetable.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DCUTimetable:
    build:
      targets:
        DCUTimetable: all
    test:
      targets:
        - DCUTimetableTests
