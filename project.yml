name: DCUTimetable

options:
  bundleIdPrefix: com.stephenh.dcutimetable
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Signing lives in Local.xcconfig (git-ignored) so your Team ID stays out of the repo and
# survives `xcodegen generate`. Create it once: cp Local.xcconfig.example Local.xcconfig
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  DCUTimetable:
    type: application
    platform: iOS
    sources:
      - path: ios/DCUTimetable
      # Compiled into the app *and* the widget extension. The widgets run in their own
      # process and cannot see the app's code, so anything both must agree on — the
      # snapshot format, the highlight rule, the tints — lives here.
      - path: ios/Shared
    dependencies:
      - target: DCUTimetableWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stephenh.dcutimetable
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        # Opts out of iPad Split View and Slide Over. A portrait-only app that allows
        # multitasking is rejected at upload, which requires every orientation.
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_CFBundleDisplayName: "DCU Timetable"
        ENABLE_TESTABILITY: YES
        CODE_SIGN_ENTITLEMENTS: ios/DCUTimetable.entitlements

  # The home-screen widgets. Entitlements are hand-written rather than generated from an
  # `entitlements:` block, so that regenerating the project can never rewrite the App Group
  # the two targets have to share.
  DCUTimetableWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/DCUTimetableWidgets
        excludes:
          - Info.plist
      - path: ios/Shared
    # No `info:` block: that key makes XcodeGen *generate* the plist at that path, which
    # would overwrite the hand-written one on every run. Point the build setting at the
    # file instead.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stephenh.dcutimetable.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ios/DCUTimetableWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: ios/DCUTimetableWidgets.entitlements
        SKIP_INSTALL: YES

  DCUTimetableTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/DCUTimetableTests
    dependencies:
      - target: DCUTimetable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stephenh.dcutimetable.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DCUTimetable:
    build:
      targets:
        DCUTimetable: all
        DCUTimetableWidgets: all
    test:
      targets:
        - DCUTimetableTests
