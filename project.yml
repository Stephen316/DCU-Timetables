name: DCUTimetable

options:
  bundleIdPrefix: com.stephenh.dcutimetable
  # Stamps LastUpgradeCheck, so Xcode stops offering "Update to recommended settings"
  # after every regenerate. Bump when moving to a new Xcode.
  xcodeVersion: "26.6"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Signing lives in Local.xcconfig (git-ignored) so your Team ID stays out of the repo and
# survives `xcodegen generate`. Create it once: cp Local.xcconfig.example Local.xcconfig
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  DCUTimetable:
    type: application
    platform: iOS
    sources:
      - path: ios/DCUTimetable
      # Compiled into the app *and* the widget extension. The widgets run in their own
      # process and cannot see the app's code, so anything both must agree on — the
      # snapshot format, the highlight rule, the tints — lives here.
      - path: ios/Shared
    dependencies:
      - target: DCUTimetableWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stephenh.dcutimetable
        # iPhone only. On an iPad it runs in iPhone compatibility mode, a layout the app has
        # already been checked in, rather than a stretched one it hasn't. Set per target:
        # XcodeGen's target presets override a project-level value.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        # Opts out of iPad Split View and Slide Over. A portrait-only app that allows
        # multitasking is rejected at upload, which requires every orientation.
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_CFBundleDisplayName: "DCU Timetable"
        # Only HTTPS through the system, which is exempt. Without this key every upload
        # stops in App Store Connect to ask.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # The student-ID step reads the barcode on the student card. Without this key the
        # first camera request crashes the app.
        INFOPLIST_KEY_NSCameraUsageDescription: "Reads the barcode on your student card to fill in your student number. The photo stays on your phone."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_TESTABILITY: YES
        CODE_SIGN_ENTITLEMENTS: ios/DCUTimetable.entitlements

  # The home-screen widgets. Entitlements are hand-written rather than generated from an
  # `entitlements:` block, so that regenerating the project can never rewrite the App Group
  # the two targets have to share.
  DCUTimetableWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/DCUTimetableWidgets
        excludes:
          - Info.plist
      - path: ios/Shared
    # No `info:` block: that key makes XcodeGen *generate* the plist at that path, which
    # would overwrite the hand-written one on every run. Point the build setting at the
    # file instead.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stephenh.dcutimetable.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ios/DCUTimetableWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: ios/DCUTimetableWidgets.entitlements
        SKIP_INSTALL: YES

  DCUTimetableTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/DCUTimetableTests
    dependencies:
      - target: DCUTimetable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stephenh.dcutimetable.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DCUTimetable:
    build:
      targets:
        DCUTimetable: all
        DCUTimetableWidgets: all
    test:
      targets:
        - DCUTimetableTests
